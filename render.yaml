services:
  - type: web
    name: trump-team-card-game
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/game.db
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
